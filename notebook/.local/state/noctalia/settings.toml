config_version = 8

[brightness]
enable_ddcutil = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 538.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[theme]
builtin = "Noctalia"
community_palette = "Ayu Blue"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "ghostty", "hyprland", "kcolorscheme", "kitty", "qt", "starship" ]
    community_ids = [ "pi-agent", "neovim", "bat", "lazygit", "yazi" ]

[wallpaper]
directory = "/home/vrivera/Imágenes/wallpapers/"

    [wallpaper.default]
    path = "/home/vrivera/Imágenes/wallpapers/spiderman-bnd.jpg"

    [wallpaper.last]
    path = "/home/vrivera/Imágenes/wallpapers/spiderman-bnd.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/vrivera/Imágenes/wallpapers/catching-the-desert.jpeg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-tonal-spot"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/vrivera/Imágenes/wallpapers/fantasy-city.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-tonal-spot"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/vrivera/Imágenes/wallpapers/spiderman-bnd.jpg"
    theme_mode = "dark"
    wallpaper_scheme = "m3-tonal-spot"

[widget.layout]
type = "vrivera/layout-controls:layout"

[widget.usage]
type = "vrivera/codex-usage:usage"

[widget.widget]
type = "yuuto/arch-updater:widget"